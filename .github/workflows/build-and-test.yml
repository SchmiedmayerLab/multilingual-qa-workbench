name: Build and Test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Compile Python
        run: python -m compileall -q src tests scripts

      - name: Validate notebooks and reject saved outputs
        run: python scripts/check_notebooks.py

      - name: Run offline regression tests
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml

      - name: Upload coverage
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true

  standards:
    name: Standards
    permissions:
      contents: read
      pull-requests: read
    uses: SchmiedmayerLab/.github/.github/workflows/repository-standards.yml@v0.5
